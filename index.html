
<!DOCTYPE html>
<html lang="es" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"NOMBRE" Barbershop | Tradición y Estilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0c0c0c;
            color: #e5e5e5;
        }
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }
        .gold-gradient {
            background: linear-gradient(45deg, #d4af37, #f7e08a, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .border-gold {
            border-color: #d4af37;
        }
        .bg-gold {
            background-color: #d4af37;
        }
        .hover-gold:hover {
            color: #d4af37;
            transition: 0.3s;
        }
        .section-divider {
            height: 2px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            margin: 4rem auto;
            width: 60%;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
          width: 8px;
        }
        ::-webkit-scrollbar-track {
          background: #0c0c0c;
        }
        ::-webkit-scrollbar-thumb {
          background: #d4af37;
        }
    </style>
